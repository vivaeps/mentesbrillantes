<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentes Brillantes V3</title>
<link rel="stylesheet" href="css/estilos-v3.css">
</head>
<body>
<div id="s-load" class="screen active">
  <img class="load-logo" id="loadLogo" src="image/v3/bg/logo.png" alt="Logo">
  <div class="load-title">SISTEMA MENTES BRILLANTES</div>
  <div class="load-sub">V3 · Trivia Demo Day Grupo 1A</div>
  <div class="load-bar-wrap"><div class="load-bar" id="lbar"></div></div>
  <div class="load-txt" id="ltxt">Cargando mundos...</div>
</div>

<div id="s-start" class="screen">
  <div class="dim soft"></div>
  <header class="topbar">
    <div class="topbar-left">
      <span class="ver-pill">V3</span>
      <span class="topbar-title">Sistema Mentes Brillantes</span>
    </div>
    <nav class="topbar-actions">
      <button type="button" class="btn-top" id="btnOptions" title="Opciones">Opciones</button>
      <button type="button" class="btn-top primary" id="btnStart">Iniciar misiones</button>
      <button type="button" class="btn-top" id="btnSettings" title="Ajustes">Ajustes</button>
    </nav>
  </header>
  <div class="start-stage">
    <div class="start-hero-copy">
      <h1>SISTEMA MENTES BRILLANTES</h1>
      <p>Conquista las 2 trivias del Demo Day</p>
    </div>
    <div class="orbit" id="startOrbit" aria-hidden="true"></div>
  </div>
</div>

<div id="s-map" class="screen"></div>
<div id="s-brief" class="screen"></div>
<div id="s-battle" class="screen"></div>
<div id="s-feedback" class="screen"></div>
<div id="s-victory" class="screen"></div>
<div id="s-defeat" class="screen"></div>
<div id="s-trans" class="screen"></div>
<div id="s-final" class="screen"></div>

<script src="js/juego-v3.js" defer></script>
</body>
</html>
